#MessLens Configuration
#Mon Nov 02 18:24:39 IST 2026
DEV_MODE=false
EVIDENCE_DIR=evidence
SQLITE_URL=jdbc\:sqlite\:messlens.db
# Database: mysql (shared server, used for the project) or sqlite (local file, no setup)
DB_TYPE=mysql
# The database "messlens" is created automatically on first run
MYSQL_URL=jdbc\:mysql\://localhost\:3306/messlens?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
MYSQL_USER=root
MYSQL_PASSWORD=
# Reject chosen photo files older than this many minutes (0 = do not check)
MAX_PHOTO_AGE_MINUTES=0
# Security settings
# Folder for the audit-log key state and the verifier key. Copy audit/audit_verifier.key to an OFFLINE place.
AUDIT_DIR=audit
# true = if the audit key file is missing, start a new audit chain instead of refusing uploads (good for a project demo). Set false for real use.
AUDIT_AUTO_RESET=true
# Sign out after this many idle minutes / after this many hours in total (NIST SP 800-63B)
SESSION_IDLE_MINUTES=15
SESSION_MAX_HOURS=8
# A warden may overturn a mess head's decision for this many days
OVERTURN_WINDOW_DAYS=7
